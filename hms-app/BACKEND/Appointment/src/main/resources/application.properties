spring.application.name=Appointment

server.port=9200

# spring.datasource.url=jdbc:mysql://localhost:3306/appointmentdb
# spring.datasource.username=root
# spring.datasource.password=Tarun@12
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:appointmentdb}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Tarun@12}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#eureka.instance.instance-id=${spring.application.name}:${random.value}

# Eureka Configuration for Docker/Cloud
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

APPOINTMENT_NOT_FOUND=Appointment not found
APPOINTMENT_ALREADY_CANCELLED=Appointment already cancelled
DOCTOR_NOT_FOUND=Doctor not found
PATIENT_NOT_FOUND=Patient not found
APPOINTMENT_RECORD_ALREADY_EXISTS=Appointment record already exists
APPOINTMENT_RECORD_NOT_FOUND=Appointment record not found

# prometheus configs
management.endpoints.web.exposure.include=*
management.prometheus.metrics.export.enabled=true
