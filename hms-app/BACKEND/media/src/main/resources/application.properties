spring.application.name=media

server.port=9400

# spring.datasource.url=jdbc:mysql://localhost:3306/mediadb
# spring.datasource.username=root
# spring.datasource.password=Tarun@12
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:mediadb}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Tarun@12}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Eureka Configuration for Docker/Cloud
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

MEDICINE_ALREADY_EXISTS=Medicine with the same name and dosage already exists.
MEDICINE_NOT_FOUND=Medicine not found

# prometheus configs
management.endpoints.web.exposure.include=*
management.prometheus.metrics.export.enabled=true