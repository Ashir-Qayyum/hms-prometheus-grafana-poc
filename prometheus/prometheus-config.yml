global:
  scrape_interval: 15s

scrape_configs:

  - job_name: 'userms'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['userms:8080']

  - job_name: 'profilems'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['profilems:9100']

  - job_name: 'appointment'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['appointment:9200']

  - job_name: 'pharmacy'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['pharmacy:9300']

  - job_name: 'media'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['media:9400']

  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:9000']

  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']